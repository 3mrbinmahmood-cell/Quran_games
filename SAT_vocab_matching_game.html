<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Vocabulary Matching Game</title>
<style>
:root{
  --bg:#071a18; --panel:#10352f; --card:#16483f; --card2:#f4fbf8;
  --text:#fff; --ink:#10231f; --muted:#b9d6cf; --accent:#e7c66a;
  --good:#1f9d69; --bad:#c94b4b;
}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#071a18,#10352f);color:var(--text);min-height:100vh}
.wrap{max-width:1100px;margin:auto;padding:24px}
header{text-align:center;margin-bottom:18px}
h1{margin:0 0 8px;font-size:clamp(1.7rem,4vw,2.6rem)}
.sub{color:var(--muted)}
.toolbar,.stats{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin:14px 0}
select,button{font:inherit;border:0;border-radius:10px;padding:10px 14px}
button{cursor:pointer;background:var(--accent);color:#18221f;font-weight:700}
button.secondary{background:#d9e8e4}
button:disabled{opacity:.45;cursor:not-allowed}
.stat{background:rgba(255,255,255,.09);padding:8px 12px;border-radius:10px}
.progress{height:10px;background:rgba(255,255,255,.12);border-radius:20px;overflow:hidden;margin:12px 0 22px}
.progress>div{height:100%;background:var(--accent);width:0}
.instructions{text-align:center;color:var(--muted);margin-bottom:16px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.col{display:flex;flex-direction:column;gap:10px}
.col h2{text-align:center;font-size:1rem;color:var(--muted);margin:0 0 4px}
.card{min-height:58px;border:2px solid transparent;border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;transition:.15s}
.word{background:var(--card);color:#fff;font-weight:700}
.meaning{background:var(--card2);color:var(--ink);font-size:1.05rem;direction:rtl}
.card:hover{transform:translateY(-1px)}
.card.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(231,198,106,.22)}
.card.matched{background:var(--good)!important;color:#fff!important;opacity:.68;cursor:default}
.card.wrong{background:var(--bad)!important;color:#fff!important}
.message{text-align:center;min-height:28px;font-weight:700;margin:15px 0}
.complete{text-align:center;background:rgba(31,157,105,.18);padding:14px;border-radius:12px;display:none}
.footer-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
@media(max-width:700px){.wrap{padding:14px}.board{gap:10px}.card{min-height:64px;padding:10px 8px;font-size:.95rem}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>SAT Vocabulary Matching Game</h1>
<div class="sub">Match each English word with its Arabic meaning — 10 pairs per round</div>
</header>

<div class="toolbar">
<label>Round:
<select id="roundSelect"></select>
</label>
<button class="secondary" id="prevBtn">Previous</button>
<button class="secondary" id="nextBtn">Next</button>
<button class="secondary" id="resetRoundBtn">Reset Round</button>
</div>

<div class="stats">
<div class="stat" id="roundStat"></div>
<div class="stat" id="scoreStat"></div>
<div class="stat" id="overallStat"></div>
</div>
<div class="progress"><div id="progressBar"></div></div>
<div class="instructions">Click an English word, then click its matching Arabic meaning.</div>

<div class="board">
<div class="col"><h2>English</h2><div id="words"></div></div>
<div class="col"><h2>العربية</h2><div id="meanings"></div></div>
</div>

<div class="message" id="message"></div>
<div class="complete" id="complete">Round complete! Excellent.</div>
<div class="footer-actions">
<button id="continueBtn" style="display:none">Next Round</button>
<button class="secondary" id="resetAllBtn">Reset All Progress</button>
</div>
</div>

مقيدون بنير"}, {"word": "yoko", "meaning": "يوكو"}, {"word": "york", "meaning": "يورك"}, {"word": "you", "meaning": "أنت"}, {"word": "young", "meaning": "شاب"}, {"word": "younger", "meaning": "أصغر سناً"}, {"word": "your", "meaning": "لك"}, {"word": "youth", "meaning": "شباب"}, {"word": "z", "meaning": "z"}, {"word": "zealous", "meaning": "متحمس"}, {"word": "zebulon", "meaning": "زيبولون"}, {"word": "zelda", "meaning": "زيلدا"}, {"word": "zenith", "meaning": "ذروة"}, {"word": "zephyr", "meaning": "نسيم"}, {"word": "zephyrs", "meaning": "نسائم"}, {"word": "zit", "meaning": "بثرة"}, {"word": "zoo", "meaning": "حديقة حيوان"}];
const PER_ROUND = 10;
const TOTAL_ROUNDS = Math.ceil(VOCAB.length/PER_ROUND);
const KEY = "sat_vocab_match_v1";

let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY)||"{}"); } catch(e){}
let currentRound = Number.isInteger(saved.currentRound) ? Math.min(saved.currentRound,TOTAL_ROUNDS-1) : 0;
let completed = new Set(Array.isArray(saved.completed) ? saved.completed : []);
let selectedWord = null;
let selectedMeaning = null;
let matched = new Set();
let attempts = 0;
let correct = 0;
let lock = false;

function save(){
 localStorage.setItem(KEY, JSON.stringify({currentRound,completed:[...completed]}));
}
function shuffle(arr){
 let a=[...arr];
 for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
 return a;
}
function roundPairs(){
 return VOCAB.slice(currentRound*PER_ROUND, currentRound*PER_ROUND+PER_ROUND)
   .map((x,i)=>({...x,id:currentRound*PER_ROUND+i}));
}
function setupSelector(){
 const s=document.getElementById("roundSelect");
 s.innerHTML="";
 for(let i=0;i<TOTAL_ROUNDS;i++){
   const o=document.createElement("option");
   o.value=i; o.textContent=`${i+1}${completed.has(i)?" ✓":""}`;
   s.appendChild(o);
 }
 s.value=currentRound;
}
function card(text, cls, id, kind){
 const d=document.createElement("div");
 d.className=`card ${cls}`;
 d.textContent=text;
 d.dataset.id=id;
 d.onclick=()=>pick(kind,d);
 return d;
}
function render(){
 selectedWord=null; selectedMeaning=null; matched=new Set(); attempts=0; correct=0; lock=false;
 const ps=roundPairs();
 const words=shuffle(ps), meanings=shuffle(ps);
 const w=document.getElementById("words"), m=document.getElementById("meanings");
 w.innerHTML="";m.innerHTML="";
 words.forEach(x=>w.appendChild(card(x.word,"word",x.id,"word")));
 meanings.forEach(x=>m.appendChild(card(x.meaning,"meaning",x.id,"meaning")));
 document.getElementById("message").textContent="";
 document.getElementById("complete").style.display="none";
 document.getElementById("continueBtn").style.display="none";
 document.getElementById("prevBtn").disabled=currentRound===0;
 document.getElementById("nextBtn").disabled=currentRound===TOTAL_ROUNDS-1;
 setupSelector(); updateStats();
 save();
}
function clearSelections(){
 document.querySelectorAll(".selected").forEach(x=>x.classList.remove("selected"));
 selectedWord=null; selectedMeaning=null;
}
function pick(kind,el){
 if(lock || el.classList.contains("matched")) return;
 if(kind==="word"){
   document.querySelectorAll(".word.selected").forEach(x=>x.classList.remove("selected"));
   selectedWord=el; el.classList.add("selected");
 } else {
   document.querySelectorAll(".meaning.selected").forEach(x=>x.classList.remove("selected"));
   selectedMeaning=el; el.classList.add("selected");
 }
 if(selectedWord && selectedMeaning) checkMatch();
}
function checkMatch(){
 lock=true; attempts++;
 const ok=selectedWord.dataset.id===selectedMeaning.dataset.id;
 if(ok){
   correct++;
   const id=selectedWord.dataset.id;
   matched.add(id);
   selectedWord.classList.add("matched"); selectedMeaning.classList.add("matched");
   selectedWord.classList.remove("selected"); selectedMeaning.classList.remove("selected");
   document.getElementById("message").textContent="Correct!";
   selectedWord=null;selectedMeaning=null;lock=false;
   if(matched.size===roundPairs().length) finishRound();
 }else{
   selectedWord.classList.add("wrong");selectedMeaning.classList.add("wrong");
   document.getElementById("message").textContent="Try again.";
   setTimeout(()=>{
     selectedWord?.classList.remove("wrong","selected");
     selectedMeaning?.classList.remove("wrong","selected");
     selectedWord=null;selectedMeaning=null;lock=false;
   },550);
 }
 updateStats();
}
function finishRound(){
 completed.add(currentRound); save(); setupSelector();
 document.getElementById("complete").style.display="block";
 if(currentRound<TOTAL_ROUNDS-1) document.getElementById("continueBtn").style.display="inline-block";
 updateStats();
}
function updateStats(){
 const n=roundPairs().length;
 document.getElementById("roundStat").textContent=`Round ${currentRound+1} / ${TOTAL_ROUNDS}`;
 document.getElementById("scoreStat").textContent=`Matched ${matched.size} / ${n}`;
 document.getElementById("overallStat").textContent=`Completed ${completed.size} / ${TOTAL_ROUNDS}`;
 document.getElementById("progressBar").style.width=(completed.size/TOTAL_ROUNDS*100)+"%";
}
function go(r){currentRound=Math.max(0,Math.min(TOTAL_ROUNDS-1,r));render();}
document.getElementById("roundSelect").onchange=e=>go(+e.target.value);
document.getElementById("prevBtn").onclick=()=>go(currentRound-1);
document.getElementById("nextBtn").onclick=()=>go(currentRound+1);
document.getElementById("continueBtn").onclick=()=>go(currentRound+1);
document.getElementById("resetRoundBtn").onclick=render;
document.getElementById("resetAllBtn").onclick=()=>{
 if(confirm("Reset all saved progress?")){
   completed.clear();currentRound=0;localStorage.removeItem(KEY);render();
 }
};
render();
</script>
