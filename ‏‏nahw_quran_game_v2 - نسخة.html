const sourceData={"الفاتحة: 2":{"verse":"الْحَمْدُ لِلّهِ رَبِّ الْعالَمِينَ","irab":"{الْحَمْدُ} مبتدأ مرفوع. {لِلّهِ}: جار ومجرور متعلق بمحذوف خبر المبتدأ، تقديره: ثابت، أو واجب. والجملة الاسمية: (الحمد … ) استئنافية.\n{رَبِّ}: نعت للفظ الجلالة مجرور. {الْعالَمِينَ}: مضاف إليه مجرور بالياء."},"الفاتحة: 5":{"verse":"إِيّاكَ نَعْبُدُ وَإِيّاكَ نَسْتَعِينُ","irab":"{إِيّاكَ} ضمير مبني في محل نصب مفعول به مقدم.\n{نَعْبُدُ}: فعل مضارع مرفوع، والفاعل مستتر تقديره: نحن. وجملة: إياك نعبد … استئنافية.\n\n(الواو): عاطفة. {إِيّاكَ نَسْتَعِينُ}: مثل: {إِيّاكَ نَعْبُدُ … } ومعطوفة عليها."},"الفاتحة: 6":{"verse":"اِهْدِنَا الصِّراطَ الْمُسْتَقِيمَ","irab":"{اِهْدِنَا}: فعل أمر للدعاء مبني على حذف حرف العلة، والفاعل مستتر تقديره:\nأنت، و (نا): ضمير مبني في محل نصب. مفعول به. {الصِّراطَ}: مفعول به ثان منصوب.\n{الْمُسْتَقِيمَ}: نعت للصراط منصوب. وجملة: (اهدنا … ) استئنافية."},"المائدة: 23":{"verse":"قالَ رَجُلانِ مِنَ الَّذِينَ يَخافُونَ أَنْعَمَ اللهُ عَلَيْهِمَا اُدْخُلُوا عَلَيْهِمُ الْبابَ فَإِذا دَخَلْتُمُوهُ فَإِنَّكُمْ غالِبُونَ وَعَلَى اللهِ فَتَوَكَّلُوا إِنْ كُنْتُمْ مُؤْمِنِينَ","irab":"{قالَ}: فعل ماض. {رَجُلانِ}: فاعل مرفوع بالألف. والجملة استئنافية.\n{مِنَ الَّذِينَ}: جار ومجرور متعلق بمحذوف نعت ل: (رجلان). {يَخافُونَ}: فعل مضارع مرفوع بثبوت النون. و (الواو): فاعل. وجملة: يخافون … صلة الموصول. {أَنْعَمَ}: فعل ماض {اللهُ}: لفظ الجلالة فاعل مرفوع. {عَلَيْهِمَا}: جار ومجرور متعلق ب: (أنعم).وجملة: أنعم الله … في محل رفع نعت ثان ل: (رجلان). [أو في محل نصب حال ل: رجلان؛ لأنه وصف، أو هي اعتراضية للدعاء]. {اُدْخُلُوا}: فعل أمر مبني على حذف النون، و (الواو): فاعل. {عَلَيْهِمُ}:\nجار ومجرور متعلق ب: ادخلوا. {الْبابَ}: مفعول به منصوب. وجملة: ادخلوا … في محل نصب مقول القول. {فَإِذا} (الفاء): عاطفة (إذا): ظرف لما يستقبل من الزمان تضمن معنى الشرط. {دَخَلْتُمُوهُ}: فعل ماض مبني على السكون و (التاء): فاعل. و (الواو): ناتجة من إشباع حركة الميم. و (الهاء): مفعول به. وجملة: دخلتموه … في محل جر بإضافة إذا إليها. {فَإِنَّكُمْ} (الفاء): رابطة لجواب الشرط. (إن): حرف ناسخ. و (الكاف): اسم إن. {غالِبُونَ}: خبر إن\n\nمرفوع بالواو. وجملة: إنكم غالبون … جواب شرط غير جازم. وجملتا الشرط والجواب معطوفتان على جملة مقول القول السابقة، في محل نصب. {وَعَلَى اللهِ} (الواو): عاطفة. (على الله): جار ومجرور متعلق ب: (توكلوا). {فَتَوَكَّلُوا} (الفاء): رابطة لجواب شرط مقدر. (توكلوا): فعل أمر مبني على حذف النون، و (الواو): فاعل. وجملة: على الله فتوكلوا: في محل جزم جواب شرط مقدر، أي: إن كنتم مؤمنين فتوكلوا على الله. {إِنْ}: حرف شرط جازم {كُنْتُمْ}: فعل ماض ناسخ في محل جزم فعل الشرط. و (التاء): ضمير في محل رفع اسم كان. {مُؤْمِنِينَ}: خبر كان منصوب بالياء. وجواب الشرط محذوف يفسره ما قبله أي: إن كنتم مؤمنين فتوكلوا على الله وجملة: إن كنتم … تفسيرية لما سبق."},"المؤمنون: 1":{"verse":"قَدْ أَفْلَحَ الْمُؤْمِنُونَ","irab":"{قَدْ}: حرف تحقيق. {أَفْلَحَ}: فعل ماض. {الْمُؤْمِنُونَ}: فاعل مرفوع بالواو، وجملة (قد أفلح … ) استئنافية أو [ابتدائية]."},"البقرة: 11":{"verse":"وَإِذا قِيلَ لَهُمْ لا تُفْسِدُوا فِي الْأَرْضِ قالُوا إِنَّما نَحْنُ مُصْلِحُونَ","irab":"{وَإِذا}: (الواو): استئنافية. (إذا): ظرف لما يستقبل من الزمان، تضمن معنى الشرط، خافض لشرطه منصوب بجوابه. {قِيلَ}: فعل ماض مبني للمجهول، ونائب الفاعل محذوف يفسره الجملة التالية. وجملة: {قِيلَ … }: في محل جر مضاف إليه، وجملة: إذا قيل\nاستئنافية. {لَهُمْ}: جار ومجرور، متعلق ب {قِيلَ}. {لا}: ناهية جازمة. {تُفْسِدُوا}: فعل\n\nمضارع مجزوم بحذف النون، و (الواو): فاعل. {فِي الْأَرْضِ}: جار ومجرور، متعلق ب {تُفْسِدُوا}. وجملة: {لا تُفْسِدُوا … }: تفسيرية لنائب الفاعل المقدر. [وهناك رأي يرى أن جملة: {لا تُفْسِدُوا}: في محل رفع نائب فاعل؛ لأنها في الأصل مقول القول، فلما حذف الفاعل حلت محله]. {قالُوا}: فعل ماض، و (الواو): فاعل. وجملة: {قالُوا}: جواب شرط (إذا) الشرطية غير الجازمة، لا محل لها من الإعراب. {إِنَّما}: حرف ناسخ مكفوف عن العمل ب (ما) الكافة. {نَحْنُ}: مبتدأ. {مُصْلِحُونَ}: خبر مرفوع بالواو. وجملة: {إِنَّما نَحْنُ … }: في محل نصب مقول القول."},"البقرة: 4":{"verse":"وَالَّذِينَ يُؤْمِنُونَ بِما أُنْزِلَ إِلَيْكَ وَما أُنْزِلَ مِنْ قَبْلِكَ وَبِالْآخِرَةِ هُمْ يُوقِنُونَ","irab":"(الواو) عاطفة. {الَّذِينَ} اسم موصول، معطوف على اسم الموصول السابق.\n{يُؤْمِنُونَ}: مضى إعرابها في الآية السابقة (3).والجملة صلة الموصول. {بِما} جار ومجرور، متعلق ب: (يؤمنون). {أُنْزِلَ} فعل ماض مبني للمفعول، ونائب الفاعل مستتر تقديره: هو.\n{إِلَيْكَ} جار ومجرور، متعلق ب (أنزل).وجملة: {أُنْزِلَ}: صلة الموصول (ما). {وَما}:\n(الواو): عاطفة. (ما): اسم موصول في محل جر بالعطف على (ما) الأولى. {أُنْزِلَ}: مثل السابق.\n{مِنْ قَبْلِكَ}: جار ومجرور، متعلق ب {أُنْزِلَ} و (الكاف): مضاف إليه. وجملة: {أُنْزِلَ … }:\nصلة الموصول. (الواو): عاطفة. {بِالْآخِرَةِ}: جار ومجرور، متعلق ب (يوقنون) الآتي. {هُمْ}:\nمبتدأ. {يُوقِنُونَ}: فعل مضارع مرفوع بثبوت النون، و (الواو): فاعل. وجملة: {يُوقِنُونَ}: في محل رفع خبر. وجملة: {بِالْآخِرَةِ هُمْ يُوقِنُونَ}: معطوفة على جملة: {يُؤْمِنُونَ،} لا محل لها."},"البقرة: 10":{"verse":"فِي قُلُوبِهِمْ مَرَضٌ فَزادَهُمُ اللهُ مَرَضاً وَلَهُمْ عَذابٌ أَلِيمٌ بِما كانُوا يَكْذِبُونَ","irab":"{فِي قُلُوبِهِمْ}: جار ومجرور، متعلق بمحذوف خبر مقدم. و (الهاء): مضاف إليه. {مَرَضٌ}: مبتدأ مؤخر، مرفوع. والجملة الاسمية استئنافية. {فَزادَهُمُ}: (الفاء): عاطفة.\n(زادهم): فعل ماض. و (الهاء): مفعول به أول. {اللهُ}: لفظ الجلالة فاعل مرفوع. {مَرَضاً}:\nمفعول به ثان منصوب. والجملة الفعلية معطوفة على السابقة لا محل لها. (الواو): عاطفة.\n{لَهُمْ}: جار ومجرور، متعلق بمحذوف خبر مقدم. {عَذابٌ}: مبتدأ مؤخر مرفوع. {أَلِيمٌ}:\nنعت مرفوع. والجملة الاسمية معطوفة على السابقة: (زادهم … ) لا محل لها. {بِما}: (الباء):\nحرف جر. (ما): اسم موصول مبني في محل جر، والجار والمجرور متعلق بمحذوف نعت ل {أَلِيمٌ} تقديره: كائن أو مستحق. {كانُوا}: فعل ماض ناقص، و (الواو): اسم (كان) في محل رفع.\n{يَكْذِبُونَ}: فعل مضارع مرفوع بثبوت النون، و (الواو): فاعل. وجملة: {يَكْذِبُونَ}: في محل نصب خبر (كان).وجملة: {كانُوا … }: صلة الموصول."},"البقرة: 19":{"verse":"أَوْ كَصَيِّبٍ مِنَ السَّماءِ فِيهِ ظُلُماتٌ وَرَعْدٌ وَبَرْقٌ يَجْعَلُونَ أَصابِعَهُمْ فِي آذانِهِمْ مِنَ الصَّواعِقِ حَذَرَ الْمَوْتِ وَاللهُ مُحِيطٌ بِالْكافِرِينَ","irab":"{أَوْ}: عاطفة. {كَصَيِّبٍ}: جار ومجرور، متعلق بمحذوف خبر لمبتدإ محذوف تقديره: هم، أو مثلهم، والكلام فيه حذف مضاف؛ أي: أصحاب صيب. {مِنَ السَّماءِ} جار ومجرور، متعلق بمحذوف نعت ل (صيّب).وجملة: {أَوْ كَصَيِّبٍ … }: لا محل لها بالعطف على جملة: {مَثَلُهُمْ كَمَثَلِ … } الاستئنافية. {فِيهِ}: جار ومجرور، متعلق بمحذوف خبر مقدم. {ظُلُماتٌ}: مبتدأ مؤخر مرفوع. وجملة: {فِيهِ ظُلُماتٌ}: نعت ثان ل (صيب).\n{وَرَعْدٌ}: (الواو): عاطفة. (رعد): معطوف على {ظُلُماتٌ} مرفوع مثله. {وَبَرْقٌ}: مثل: ورعد.\n{يَجْعَلُونَ}: فعل مضارع مرفوع بثبوت النون، و (الواو): فاعل. {أَصابِعَهُمْ}: مفعول به منصوب.\nو (الهاء): مضاف إليه. {فِي آذانِهِمْ}: جار ومجرور، متعلق ب {يَجْعَلُونَ}. و (الهاء): مضاف إليه.\nوجملة: {يَجْعَلُونَ}: استئنافية. [أو في محل جر نعت لأصحاب صيب]. {مِنَ الصَّواعِقِ}: جار ومجرور، متعلق ب {يَجْعَلُونَ}. {حَذَرَ}: مفعول لأجله منصوب. {الْمَوْتِ}: مضاف إليه:\n{وَاللهُ}: (الواو): استئنافية (الله): لفظ الجلالة مبتدأ مرفوع. {مُحِيطٌ}: خبر مرفوع.\n{بِالْكافِرِينَ}: جار ومجرور بالياء متعلق ب {مُحِيطٌ}. وجملة: {وَاللهُ مُحِيطٌ … }: استئنافية."},"الأعراف: 19":{"verse":"وَيا آدَمُ اُسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ فَكُلا مِنْ حَيْثُ شِئْتُما وَلا تَقْرَبا هذِهِ الشَّجَرَةَ فَتَكُونا مِنَ الظّالِمِينَ","irab":"{وَيا آدَمُ}: (الواو): استئنافية. (يا): أداة نداء. (آدم): منادى مبني على الضم في محل نصب. وجملة النداء استئنافية. {اُسْكُنْ}: فعل أمر مبني على السكون، والفاعل مستتر تقديره: أنت. {أَنْتَ}: توكيد للضمير المستتر في محل رفع. {وَزَوْجُكَ} (الواو): عاطفة.\n(زوجك): معطوف على فاعل اسكن مرفوع، و (الكاف): مضاف إليه. {الْجَنَّةَ}: مفعول به منصوب على نزع الخافض، وجملة: اسكن … جواب النداء لا محل لها. {فَكُلا} (الفاء):\nعاطفة. (كلا): فعل أمر مبني على حذف النون، و (الألف): ألف الاثنين فاعل. وجملة: كلا\nمعطوفة على جملة: اسكن. {مِنْ}: حرف جر. {حَيْثُ}: اسم ظرفي مبني على الضم في محل جر متعلق ب: كلا. {شِئْتُما}: فعل ماض، و (التاء): فاعل والميم: حرف عماد، والألف حرف دال على التثنية. وجملة: شئتما … في محل جر مضاف إليه. {وَلا} (الواو): عاطفة.\n\n(لا): ناهية جازمة. {تَقْرَبا}: فعل مضارع مجزوم بحذف النون، و (الألف): فاعل. {هذِهِ}:\nاسم إشارة مفعول به. {الشَّجَرَةَ}: بدل منصوب من اسم الإشارة [أو عطف بيان أو نعت].\nوجملة: لا تقربا … معطوفة على جملة: كلا … {فَتَكُونا} (الفاء): فاء السببية. (تكونا): فعل مضارع ناسخ منصوب بأن مضمرة بعد الفاء، وعلامة نصبه حذف النون. و (الألف): اسم تكون. {مِنَ الظّالِمِينَ}: جار ومجرور بالياء متعلق بمحذوف خبر تكون. والمصدر المؤول من أن والفعل معطوف على الجملة السابقة."},"الأعراف: 22":{"verse":"فَدَلاّهُما بِغُرُورٍ فَلَمّا ذاقَا الشَّجَرَةَ بَدَتْ لَهُما سَوْآتُهُما وَطَفِقا يَخْصِفانِ عَلَيْهِما مِنْ وَرَقِ الْجَنَّةِ وَناداهُما رَبُّهُما أَلَمْ أَنْهَكُما عَنْ تِلْكُمَا الشَّجَرَةِ وَأَقُلْ لَكُما إِنَّ الشَّيْطانَ لَكُما عَدُوٌّ مُبِينٌ","irab":"{فَدَلاّهُما} (الفاء): عاطفة. (دلاهما): فعل ماض، والفاعل مستتر تقديره: هو، و (الهاء): مفعول به. وجملة: دلاهما … معطوفة على جملة: وقاسمهما .. لا محل لها. {بِغُرُورٍ}:\nجار ومجرور متعلق بمحذوف حال من الفاعل، أي: مغرورا [أو من المفعول، أي: مغترين، أو متعلق بالفعل: دلّى]. {فَلَمّا} (الفاء): عاطفة. (لما): ظرف بمعنى حين متضمن معنى الشرط، في محل نصب متعلق بالفعل: بدت. {ذاقَا}: فعل ماض، و (الألف): فاعل. {الشَّجَرَةَ}: مفعول به منصوب. وجملة: ذاقا … في محل جر مضاف إليه. {بَدَتْ}: فعل ماض مبني على الفتح المقدر على الألف المحذوفة. و (التاء): للتأنيث. {لَهُما}: جار ومجرور متعلق ب: بدت. {سَوْآتُهُما}:\nفاعل مرفوع، و (الهاء): مضاف إليه. وجملة: بدت … جواب شرط غير جازم. {وَطَفِقا}: (الواو):\nعاطفة. (طفقا): فعل ماض ناسخ من أفعال الشروع. و (الألف): اسم طفق. {يَخْصِفانِ}: فعل مضارع مرفوع بثبوت النون، و (الألف): فاعل. {عَلَيْهِما}: جار ومجرور متعلق بمحذوف حال [أو متعلق بالفعل يخصفان]. {مِنْ وَرَقِ}: جار ومجرور متعلق بمحذوف نعت لمفعول يخصفان المقدر، أي: … شيئا من ورق … {الْجَنَّةِ}: مضاف إليه مجرور. وجملة: يخصفان … في محل نصب خبر طفق. وجملة: طفقا … معطوفة على جملة: بدت … لا محل لها. {وَناداهُما}:\n(الواو): عاطفة. (ناداهما): فعل ماض، و (الهاء): مفعول به. {رَبُّهُما}: فاعل مرفوع، و (الهاء):\nمضاف إليه. وجملة: ناداهما … معطوفة على جملة: بدت … {أَلَمْ} (الهمزة) للاستفهام. (لم):\nحرف نفي وجزم وقلب. {أَنْهَكُما}: فعل مضارع مجزوم بحذف حرف العلة، والفاعل مستتر\n\nتقديره: أنا، و (الكاف): مفعول به. {عَنْ تِلْكُمَا}: جار ومجرور متعلق ب: أنهى. {الشَّجَرَةَ}: بدل من اسم الإشارة مجرور [أو عطف بيان أو نعت].وجملة: ألم أنهكما … في محل نصب مقول القول [أو أنها تفسيرية للنداء لا محل لها]. {وَأَقُلْ} (الواو): عاطفة. (أقل): فعل مضارع مجزوم بالعطف على: أنهكما، والفاعل مستتر تقديره: أنا. وجملة: أقل … معطوفة على جملة: ألم أنهكما … {لَكُما}: جار ومجرور متعلق ب: أقل. {إِنَّ}: حرف توكيد ونصب. {الشَّيْطانَ}:\nاسم إن منصوب. {لَكُما}: جار ومجرور متعلق بمحذوف حال، لأنه نعت تقدم على منعوته [أو متعلق ب: عدو] {عَدُوٌّ}: خبر إن مرفوع. {مُبِينٌ}: نعت مرفوع. وجملة: إن الشيطان … في محل نصب مقول القول."},"الأعراف: 23":{"verse":"قالا رَبَّنا ظَلَمْنا أَنْفُسَنا وَإِنْ لَمْ تَغْفِرْ لَنا وَتَرْحَمْنا لَنَكُونَنَّ مِنَ الْخاسِرِينَ","irab":"{قالا}: فعل ماض، و (الألف): فاعل. وجملة: قالا … استئنافية. {رَبَّنا}:\nمنادى مضاف منصوب، حذفت منه أداة النداء. و (نا): مضاف إليه. وجملة النداء في محل نصب مقول القول. {ظَلَمْنا}: فعل ماض، و (نا): فاعل. {أَنْفُسَنا}: مفعول به منصوب، و (نا): مضاف إليه. وجملة جواب النداء: ظلمنا … في محل نصب لأنها داخلة في حيز القول. {وَإِنْ}: (الواو):\nعاطفة. (إن): حرف شرط جازم. {لَمْ}: حرف نفي. {تَغْفِرْ}: فعل مضارع مجزوم فعل الشرط. والفاعل مستتر تقديره: أنت. {لَنا}: جار ومجرور متعلق ب: تغفر. وجملة: إن لم تغفر\nمعطوفة على جملة: ظلمنا … في محل نصب. {وَتَرْحَمْنا} (الواو): عاطفة. (ترحمنا): فعل مضارع مجزوم بالسكون، لأنه معطوف على تغفر، والفاعل مستتر تقديره: أنت، و (نا): مفعول به.\nوجملة: ترحمنا … معطوفة على جملة: تغفر … في محل نصب. {لَنَكُونَنَّ} (اللام): واقعة في جواب قسم مقدر. (نكونن): فعل مضارع ناسخ مبني على الفتح لاتصاله بنون التوكيد، و (النون):\nنون التوكيد، واسم نكون مستتر تقديره: نحن. {مِنَ الْخاسِرِينَ}: جار ومجرور متعلق بمحذوف خبر نكون. وجملة: لنكونن … جواب قسم لا محل لها من الإعراب، وجواب الشرط محذوف دل عليه جواب القسم."},"الأعراف: 26":{"verse":"يا بَنِي آدَمَ قَدْ أَنْزَلْنا عَلَيْكُمْ لِباساً يُوارِي سَوْآتِكُمْ وَرِيشاً وَلِباسُ التَّقْوى ذلِكَ خَيْرٌ ذلِكَ مِنْ آياتِ اللهِ لَعَلَّهُمْ يَذَّكَّرُونَ","irab":"{يا بَنِي}: (يا) أداة نداء. {بَنِي}: منادى مضاف منصوب بالياء. {آدَمَ}:\nمضاف إليه مجرور بالفتحة. وجملة النداء استئنافية. {قَدْ}: حرف تحقيق {أَنْزَلْنا}: فعل ماض، و (نا): فاعل. {عَلَيْكُمْ}: جار ومجرور متعلق ب: أنزلنا. {لِباساً}: مفعول به منصوب. وجملة: قد أنزلنا … جواب النداء. {يُوارِي}: فعل مضارع مرفوع بضمة مقدرة، والفاعل مستتر تقديره: هو.\n{سَوْآتِكُمْ}: مفعول به منصوب بالكسرة، و (الكاف): مضاف إليه. وجملة: يواري … في محل نصب نعت ل: لباسا. {وَرِيشاً} (الواو): عاطفة. (ريشا): معطوف على لباسا منصوب، وهو نائب عن موصوف محذوف أي: لباسا ريشا. {وَلِباسُ} (الواو): استئنافية [أو حالية] (لباس): مبتدأ مرفوع. {التَّقْوى}: مضاف إليه مجرور بكسرة مقدرة. {ذلِكَ}: اسم إشارة مبتدأ ثان [أو بدل من لباس التقوى، أو عطف بيان له، أو نعت، و: خير: خبر لباس]. {خَيْرٌ}: خبر المبتدأ الثاني.\nوجملة: المبتدأ الثاني وخبره في محل رفع خبر المبتدأ الأول. وجملة: لباس التقوى … استئنافية. [أو\n\nفي محل نصب حال]. {ذلِكَ}: اسم إشارة مبتدأ. {مِنْ آياتِ}: جار ومجرور متعلق بمحذوف خبر. {اللهِ}: لفظ الجلالة مضاف إليه مجرور. والجملة الاسمية: ذلك من … استئنافية.\n{لَعَلَّهُمْ}: حرف ترج ونصب، و (الهاء): اسم لعل. {يَذَّكَّرُونَ}: فعل مضارع مرفوع بثبوت النون، و (الواو): فاعل. وجملة: يذكرون في محل رفع خبر لعل. وجملة: لعلهم\nتعليلية."},"الإسراء: 97":{"verse":"وَمَنْ يَهْدِ اللهُ فَهُوَ الْمُهْتَدِ وَمَنْ يُضْلِلْ فَلَنْ تَجِدَ لَهُمْ أَوْلِياءَ مِنْ دُونِهِ وَنَحْشُرُهُمْ يَوْمَ الْقِيامَةِ عَلى وُجُوهِهِمْ عُمْياً وَبُكْماً وَصُمًّا مَأْواهُمْ جَهَنَّمُ كُلَّما خَبَتْ زِدْناهُمْ سَعِيراً","irab":"{وَمَنْ} (الواو): استئنافية. (من) شرطية جازمة في محل نصب مفعول به مقدّم.\n{يَهْدِ}: مضارع مجزوم فعل الشرط وعلامة الجزم حذف حرف العلة. {اللهُ}: لفظ الجلالة فاعل مرفوع، والجملة استئنافية. {فَهُوَ}: (الفاء) رابطة لجواب الشرط و (هو) مبتدأ. {الْمُهْتَدِ}: خبر مرفوع بالضمة المقدرة على الياء المحذوفة تخفيفا، والجملة في محل جزم جواب الشرط. {وَمَنْ يُضْلِلْ} (الواو): عاطفة. (من يضلل): مثل (من يهد) وعلامة الجزم السكون، والفاعل مستتر (هو) والجملة لا محل لها معطوفة على الاستئنافية. {فَلَنْ}: (الفاء) رابطة و (لن) نافية ناصبة. {تَجِدَ}:\n\nمضارع منصوب والفاعل مستتر-أنت-والجملة في محل جزم جواب الشرط الثاني. {لَهُمْ}:\nجار ومجرور متعلق بمفعول به ثان محذوف. {أَوْلِياءَ}: مفعول به أوّل منصوب. {مِنْ دُونِهِ}:\nجار ومجرور متعلق بنعت ل (أولياء) و (الهاء) مضاف إليه. {وَنَحْشُرُهُمْ} (الواو): استئنافية.\n(نحشرهم): مضارع مرفوع والفاعل مستتر-نحن-و (الهاء) مفعول به، والجملة استئنافية. {يَوْمَ}:\nظرف زمان منصوب متعلق ب (نحشرهم). {الْقِيامَةِ}: مضاف إليه مجرور. {عَلى وُجُوهِهِمْ}::\nجار ومجرور متعلق بحال من المفعول في: نحشرهم و (الهاء) مضاف إليه. {عُمْياً}: حال ثانية منصوبة {وَبُكْماً}: (الواو) عاطفة و (بكما) معطوفة على عميا منصوبة. {وَصُمًّا}: مثل: وبكما.\n{مَأْواهُمْ}: مبتدأ مرفوع بالضمة المقدرة و (الهاء) مضاف إليه. {جَهَنَّمُ}: خبر مرفوع والجملة استئناف بياني [أو هي حال]. {كُلَّما}: ظرف مبني متضمن معنى الشرط متعلق بالجواب.\n{خَبَتْ}: ماض و (التاء) للتأنيث، والفاعل مستتر-هي-والجملة في محل جر مضاف إليه [ويجوز أن يكون الظرف (كلّ) و (ما) مصدرية ظرفية وهي وما بعدها في محل جر مضاف إليه، والمضاف والمضاف إليه في محل نصب حال من جهنم]. {زِدْناهُمْ}: ماض و (نا) فاعله و (الهاء) مفعوله الأول، والجملة جواب الشرط لا محل لها. {سَعِيراً}: مفعول به ثان منصوب."},"الإسراء: 90":{"verse":"وَقالُوا لَنْ نُؤْمِنَ لَكَ حَتّى تَفْجُرَ لَنا مِنَ الْأَرْضِ يَنْبُوعاً","irab":"{وَقالُوا} (الواو): استئنافية. (قالوا): ماض و (الواو) فاعله، والجملة استئنافية.\n{لَنْ}: نافية ناصبة. {نُؤْمِنَ}: مضارع منصوب، والفاعل مستتر-نحن-والجملة في محل نصب مقول القول. {لَكَ}: جار ومجرور متعلق ب (نؤمن). {حَتّى}: حرف غاية وجر. {تَفْجُرَ}:\nمضارع منصوب بأن مضمرة بعد حتى والفاعل مستتر-أنت-والمصدر المؤول من (أن تفجر) في محل جر بحتى متعلق ب (نؤمن). {لَنا}: جار ومجرور متعلق ب (تفجر). {مِنَ الْأَرْضِ}:: جار ومجرور متعلق بحال من ينبوعا {يَنْبُوعاً}: مفعول به منصوب."},"الزمر: 3":{"verse":"أَلا لِلّهِ الدِّينُ الْخالِصُ وَالَّذِينَ اِتَّخَذُوا مِنْ دُونِهِ أَوْلِياءَ ما نَعْبُدُهُمْ إِلاّ لِيُقَرِّبُونا إِلَى اللهِ زُلْفى إِنَّ اللهَ يَحْكُمُ بَيْنَهُمْ فِي ما هُمْ فِيهِ يَخْتَلِفُونَ إِنَّ اللهَ لا يَهْدِي مَنْ هُوَ كاذِبٌ كَفّارٌ","irab":"{أَلا}: حرف تنبيه. {لِلّهِ}: (اللام): حرف جر ولفظ الجلالة اسم مجرور، والجار والمجرور متعلق بخبر مقدم. {الدِّينُ}: مبتدأ مؤخر مرفوع، وجملة: (لله الدين … ) لا محل لها استئنافية. {الْخالِصُ}: نعت مرفوع. {وَالَّذِينَ}: (الواو): استئنافية. (الذين): اسم موصول مبني في محل رفع مبتدأ، والخبر محذوف تقديره: (يقولون … ).\n\n{اِتَّخَذُوا}: فعل ماض، و (الواو): فاعل، وجملة: (اتخذوا … ) صلة الموصول لا محل لها. {مِنْ دُونِهِ}: جار ومجرور متعلق بمحذوف مفعول به ثان، و (الهاء): مضاف إليه. {أَوْلِياءَ}: مفعول به منصوب. {ما}: نافية. {نَعْبُدُهُمْ}: فعل مضارع مرفوع، و (الهاء): مفعول به، والفاعل مستتر تقديره: نحن، وجملة: (ما نعبدهم … ) في محل نصب مقول القول المحذوف. {أَلا}: للحصر.\n{لِيُقَرِّبُونا}: (اللام): لام التعليل، (يقربونا): فعل مضارع منصوب بحذف النون بعد (أن) مضمرة، و (الواو): فاعل، و (نا): مفعول به، و (أن) والفعل في تأويل مصدر مجرور باللام متعلق ب (نعبدهم). {إِلَى}: حرف جر. {اللهِ}: لفظ الجلالة اسم مجرور، والجار والمجرور متعلق ب (يقربونا). {زُلْفى}: نائب عن المفعول المطلق منصوب. {إِنَّ}: حرف توكيد ونصب.\n{اللهِ}: لفظ الجلالة اسم إن منصوب. {يَحْكُمُ}: فعل مضارع مرفوع، والفاعل مستتر تقديره:\nهو، وجملة: (يحكم … ) في محل رفع خبر (إن). {بَيْنَهُمْ}: ظرف منصوب، و (الهاء): مضاف إليه، وجملة: (إن الله يحكم … ) لا محل لها استئناف بياني. {فِي ما}: جار ومجرور متعلق ب (يحكم). {هُمْ}: مبتدأ. {فِيهِ}: جار ومجرور متعلق ب (يختلفون). {يَخْتَلِفُونَ}: فعل مضارع مرفوع بثبوت النون، والواو: فاعل، وجملة: (يختلفون … ) في محل رفع خبر المبتدأ: (هم)، وجملة: (هم فيه يختلفون) لا محل لها صلة الموصول. {إِنَّ}: حرف توكيد ونصب.\n{اللهِ}: لفظ الجلالة: اسم إن منصوب. {لا}: نافية. {يَهْدِي}: فعل مضارع مرفوع، والفاعل مستتر تقديره: هو، وجملة: (لا يهدي … ) في محل رفع خبر إن، وجملة: (إن الله لا يهدي … ) لا محل لها استئنافية. {مِنْ}: اسم موصول مفعول به. {هُوَ}: مبتدأ. {كاذِبٌ}: خبر مرفوع.\nوجملة: (هو كاذب … ) لا محل لها صلة الموصول. {كَفّارٌ}:: خبر ثان مرفوع للمبتدإ هو."},"الزمر: 4":{"verse":"لَوْ أَرادَ اللهُ أَنْ يَتَّخِذَ وَلَداً لاصْطَفى مِمّا يَخْلُقُ ما يَشاءُ سُبْحانَهُ هُوَ اللهُ الْواحِدُ الْقَهّارُ","irab":"{لَوْ}: حرف شرط غير جازم. {أَرادَ}: فعل ماض. {اللهُ}: لفظ الجلالة فاعل مرفوع، وجملة: (أراد الله … ) لا محل لها استئنافية. {أَنْ}: حرف مصدري ونصب. {يَتَّخِذَ}:\nفعل مضارع منصوب، والفاعل مستتر تقديره: هو، والمصدر المؤول: (أن يتخذ في محل نصب مفعول به. {وَلَداً}: مفعول به منصوب. {لاصْطَفى}: (اللام): رابطة لجواب الشرط، (اصطفى): فعل ماض والفاعل مستتر تقديره: هو، وجملة: (اصطفى … ) لا محل لها جواب شرط غير جازم. {مِمّا}:\nجار ومجرور متعلق ب (اصطفى). {يَخْلُقُ}: فعل مضارع مرفوع، والفاعل مستتر تقديره: هو، وجملة:\n\n(يخلق … ) لا محل لها صلة الموصول. {ما}: اسم موصول مفعول به. {يَشاءُ}: مثل (يخلق … ).\n{سُبْحانَهُ}: مفعول مطلق منصوب لفعل محذوف، و (الهاء): مضاف إليه، وجملة: (\nسبحان … ) لا محل لها اعتراضية. {هُوَ}: مبتدأ. {اللهُ}: لفظ الجلالة خبر مرفوع. {الْواحِدُ}:\nنعت مرفوع. {الْقَهّارُ}: نعت ثان مرفوع. وجملة: (هو الله … ) لا محل لها استئناف بياني."},"الزمر: 5":{"verse":"خَلَقَ السَّماواتِ وَالْأَرْضَ بِالْحَقِّ يُكَوِّرُ اللَّيْلَ عَلَى النَّهارِ وَيُكَوِّرُ النَّهارَ عَلَى اللَّيْلِ وَسَخَّرَ الشَّمْسَ وَالْقَمَرَ كُلٌّ يَجْرِي لِأَجَلٍ مُسَمًّى أَلا هُوَ الْعَزِيزُ الْغَفّارُ","irab":"{خَلَقَ}: فعل ماض، والفاعل مستتر تقديره: هو. {السَّماواتِ}: مفعول به منصوب بالكسرة، وجملة: (خلق … ) لا محل لها استئناف بياني. {وَالْأَرْضَ}: (الواو): عاطفة، (الأرض): معطوف منصوب. {بِالْحَقِّ}: جار ومجرور متعلق بحال من فاعل خلق. {يُكَوِّرُ}: فعل مضارع والفاعل مستتر تقديره: هو. {اللَّيْلَ}: مفعول به منصوب، وجملة: (يكور الليل … ) لا محل لها استئناف بياني آخر [أو في محل نصب حال]. {عَلَى النَّهارِ}: جار ومجرور متعلق ب (يكور).\n{وَيُكَوِّرُ النَّهارَ عَلَى اللَّيْلِ} مثل إعراب: (يكور الليل على النهار … ) ومعطوفة عليها.\n{وَسَخَّرَ}: (الواو): عاطفة. (سخر): فعل ماض، والفاعل مستتر تقديره: هو. {الشَّمْسَ}: مفعول به منصوب وجملة: (سخر الشمس … ) لا محل لها معطوفة على جملة: (خلق … ) {وَالْقَمَرَ}:\n(الواو): عاطفة، (القمر): معطوف منصوب. {كُلٌّ}: مبتدأ مرفوع. {يَجْرِي}: فعل مضارع مرفوع، والفاعل مستتر تقديره: هو، وجملة: (يجري … ) في محل رفع خبر المبتدأ، وجملة: (كل يجري … ) لا محل لها استئناف بياني [أو في محل نصب حال من الشمس والقمر]. {لِأَجَلٍ}: جار ومجرور متعلق ب: (يجري). {مُسَمًّى}: نعت مجرور. {أَلا}: حرف تنبيه. {هُوَ}: مبتدأ.\n{الْعَزِيزُ}: خبر مرفوع. {الْغَفّارُ}: خبر ثان مرفوع، وجملة: (هو العزيز … ) استئنافية لا محل لها."},"الزمر: 7":{"verse":"إِنْ تَكْفُرُوا فَإِنَّ اللهَ غَنِيٌّ عَنْكُمْ وَلا يَرْضى لِعِبادِهِ الْكُفْرَ وَإِنْ تَشْكُرُوا يَرْضَهُ لَكُمْ وَلا تَزِرُ وازِرَةٌ وِزْرَ أُخْرى ثُمَّ إِلى رَبِّكُمْ مَرْجِعُكُمْ فَيُنَبِّئُكُمْ بِما كُنْتُمْ تَعْمَلُونَ إِنَّهُ عَلِيمٌ بِذاتِ الصُّدُورِ","irab":"{إِنْ}: حرف شرط جازم. {تَكْفُرُوا}: فعل مضارع فعل الشرط مجزوم بحذف النون و (الواو): فاعل، وجملة: (إن تكفروا … ) لا محل لها استئنافية. {فَإِنَّ}: (الفاء):\nرابطة، (إن): حرف توكيد ونصب. (الله:) لفظ الجلالة اسم (إن) منصوب. {غَنِيٌّ}: خبر (إن)\n\nمرفوع، وجملة: (إن الله غني … ) في محل جزم جواب الشرط. {عَنْكُمْ}: جار ومجرور متعلق ب: (غني). {وَلا}: (الواو): عاطفة، (لا): نافية. {يَرْضى}: فعل مضارع مرفوع، والفاعل مستتر تقديره: هو، وجملة: (لا يرضى … ) في محل رفع معطوفة على خبر (إن). {لِعِبادِهِ}: جار ومجرور متعلق ب: (يرضى) و (الهاء): مضاف إليه. {الْكُفْرَ}: مفعول به منصوب. {وَإِنْ تَشْكُرُوا}: مثل إعراب: (إن تكفروا … ) في أول الآية ومعطوفة عليها. {يَرْضَهُ}: فعل مضارع جواب الشرط مجزوم بحذف حرف العلة، و (الهاء): مفعول به، والفاعل مستتر تقديره: هو. {لَكُمْ}: جار ومجرور متعلق ب: (يرضه)، وجملة: (يرضه لكم … ) لا محل لها جواب الشرط غير مقترنة بالفاء.\n{وَلا}: (الواو): استئنافية، (لا) نافية. {تَزِرُ}: فعل مضارع مرفوع. {وازِرَةٌ}: فاعل مرفوع.\n{وِزْرَ}: مفعول به منصوب. {أُخْرى}: مضاف إليه مجرور بالفتحة، وجملة: (لا تزر وازرة … ) لا محل لها استئنافية. {ثُمَّ}: حرف عطف. {إِلى رَبِّكُمْ}: جار ومجرور متعلق بمحذوف خبر مقدم و (الكاف) مضاف إليه. {مَرْجِعُكُمْ}: مبتدأ مرفوع مؤخر، (والكاف) مضاف إليه، وجملة: (إلى ربكم مرجعكم … ) لا محل لها معطوفة على الاستئنافية. {فَيُنَبِّئُكُمْ}:\n(الفاء): عاطفة، (ينبئكم): فعل مضارع مرفوع، و (الكاف): مفعول به والفاعل مستتر تقديره: هو، وجملة: (ينبئكم … ) لا محل لها معطوفة على جملة: (إلى ربكم مرجعكم … ) {بِما}: جار ومجرور متعلق ب: (عليم). {كُنْتُمْ}: فعل ماض ناسخ، و (التاء): اسم كان. {تَعْمَلُونَ}: فعل مضارع مرفوع بثبوت النون، و (الواو): فاعل، وجملة: (تعملون … ) في محل نصب خبر كنتم، وجملة: (كنتم تعملون … ) صلة الموصول لا محل لها. {إِنَّهُ}: حرف توكيد ونصب، و (الهاء):\nاسم (إن). {عَلِيمٌ}: خبر (إن) مرفوع، وجملة: (إنه عليم … ) لا محل لها اعتراضية. {بِذاتِ}:\nجار ومجرور متعلق ب: (عليم). {الصُّدُورِ}: مضاف إليه مجرور."},"الزمر: 9":{"verse":"أَمَّنْ هُوَ قانِتٌ آناءَ اللَّيْلِ ساجِداً وَقائِماً يَحْذَرُ الْآخِرَةَ وَيَرْجُوا رَحْمَةَ رَبِّهِ قُلْ هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لا يَعْلَمُونَ إِنَّما يَتَذَكَّرُ أُولُوا الْأَلْبابِ","irab":"{أَمَّنْ}: (أم): حرف إضراب، (من): اسم موصول مبتدأ، والخبر محذوف تقديره: كمن هو عاص، والجملة من المبتدأ والخبر لا محل لها استئناف في حيز القول في الآية\n\nالسابقة. {هُوَ}: مبتدأ. {قانِتٌ}: خبر مرفوع، وجملة: (هو قانت … ) لا محل لها صلة الموصول. {آناءَ}: ظرف زمان منصوب. {اللَّيْلِ}: مضاف إليه مجرور. {ساجِداً}: حال منصوب. {وَقائِماً}: (الواو): عاطفة، (قائما): معطوف منصوب. {يَحْذَرُ}: فعل مضارع مرفوع، والفاعل مستتر تقديره: هو، وجملة: (يحذر … ) في محل نصب حال ثانية. {الْآخِرَةَ}:\nمفعول به منصوب. {وَيَرْجُوا رَحْمَةَ}: مثل إعراب: (يحذر الآخرة … ) ومعطوفة عليها. {رَبِّهِ}.\nمضاف إليه مجرور، و (الهاء): مضاف إليه. {قُلْ}: فعل أمر، والفاعل مستتر تقديره: أنت، وجملة: (قل … ) لا محل لها استئنافية. {هَلْ}: حرف استفهام. {يَسْتَوِي}: فعل مضارع مرفوع. {الَّذِينَ}: اسم موصول فاعل. {يَعْلَمُونَ}: فعل مضارع مرفوع بثبوت النون، و (الواو): فاعل، وجملة: (يستوي الذين … ) في محل نصب مقول القول، وجملة: (يعلمون … ) لا محل لها صلة الموصول. {وَالَّذِينَ}: (الواو): عاطفة، (الذين): اسم موصول في محل رفع معطوف على (الذين) السابقة. {لا}: نافية. {يَعْلَمُونَ}: فعل مضارع مرفوع بثبوت النون و (الواو): فاعل، وجملة: (يعلمون … ) صلة الموصول لا محل لها. {إِنَّما}: كافة ومكفوفة.\n{يَتَذَكَّرُ}: فعل مضارع مرفوع. {أُولُوا}: فاعل مرفوع بالواو لأنه ملحق بجمع المذكر السالم، وجملة: (يتذكر أولو … ) لا محل لها استئنافية. {الْأَلْبابِ}: مضاف إليه مجرور."},"الزمر: 28":{"verse":"قُرْآناً عَرَبِيًّا غَيْرَ ذِي عِوَجٍ لَعَلَّهُمْ يَتَّقُونَ","irab":"{قُرْآناً}: حال منصوب. {عَرَبِيًّا}: نعت منصوب. {غَيْرَ}: نعت ثان منصوب. {ذِي}: مضاف إليه مجرور بالياء. {عِوَجٍ}: مضاف إليه مجرور. {لَعَلَّهُمْ يَتَّقُونَ}:\nمثل إعراب: (لعلهم يتذكرون … ) في الآية السابقة."}};
const F=[
 ["kind","١. ما نوع الكلمة؟"],
 ["role","٢. ما الوظيفة النحوية؟"],
 ["state","٣. ما الحالة الإعرابية؟"],
 ["mark","٤. ما علامة الإعراب؟"],
 ["sent","٥. ما نوع الجملة أو التركيب؟"]
];

let order=[], index=0, score=0, wrong=0, answered=0;

const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}

function restartGame(){
  order=shuffle(data);
  index=0; score=0; wrong=0; answered=0;
  $("score").textContent="0";
  $("wrong").textContent="0";
  $("bar").style.width="0%";
  $("summary").className="summary hide";
  renderSet();
}

function makeOptions(field, correct){
  const others=[...new Set(data.map(z=>z[field]))].filter(v=>v!==correct);
  return shuffle([correct,...shuffle(others).slice(0,3)]);
}

function renderSet(){
  answered=0;
  $("nextSet").className="primary hide";
  $("summary").className="summary hide";
  $("sourceReview").className="sourceReview hide";
  const x=order[index];
  $("exampleNum").textContent=(index+1)+" / "+order.length;
  $("ref").textContent=x.r;
  $("aya").innerHTML=x.a.replace(x.w,'<span class="t">'+x.w+'</span>');
  const box=$("questions");
  box.innerHTML="";

  F.forEach(([field,label],qIndex)=>{
    const section=document.createElement("section");
    section.className="qcard";
    const title=document.createElement("div");
    title.className="qtitle";
    title.textContent=label;
    const choices=document.createElement("div");
    choices.className="choices";
    const feedback=document.createElement("div");
    feedback.className="feedback hide";

    makeOptions(field,x[field]).forEach(v=>{
      const b=document.createElement("button");
      b.type="button";
      b.textContent=v;
      b.addEventListener("click",()=>answerQuestion(choices,feedback,b,v,x[field],x));
      choices.appendChild(b);
    });

    section.append(title,choices,feedback);
    box.appendChild(section);
  });
}

function answerQuestion(choices,feedback,button,value,correct,x){
  if(choices.dataset.done==="1") return;
  choices.dataset.done="1";
  answered++;

  [...choices.children].forEach(b=>{
    b.disabled=true;
    if(b.textContent===correct) b.classList.add("ok");
  });

  if(value===correct){
    score++;
    feedback.innerHTML="<b>صحيح ✓</b>";
  }else{
    wrong++;
    button.classList.add("bad");
    feedback.innerHTML="<b>الصواب: "+correct+"</b>";
  }
  feedback.className="feedback";
  $("score").textContent=score;
  $("wrong").textContent=wrong;

  const total=data.length*F.length;
  const completed=index*F.length+answered;
  $("bar").style.width=(completed/total*100)+"%";

  if(answered===F.length){
    $("summary").innerHTML="<b>التحليل المختصر للكلمة:</b> "+explain(x);
    $("summary").className="summary";
    showSourceReview(x);
    if(index < order.length-1){
      $("nextSet").textContent="انتقل إلى المثال التالي ←";
      $("nextSet").className="primary";
    }else{
      $("nextSet").textContent="إنهاء وعرض النتيجة";
      $("nextSet").className="primary";
    }
  }
}

function showSourceReview(x){
  const s=sourceData[x.r];
  if(!s){
    $("sourceReview").className="sourceReview hide";
    return;
  }
  $("sourceVerse").textContent=s.verse+" ("+x.r+")";
  $("sourceIrab").textContent=s.irab;
  $("sourceReview").className="sourceReview";
}

function explain(x){
  return "<b>"+x.w+"</b> — "+x.role+"؛ "+x.state+"، وعلامته: "+x.mark+"؛ "+x.sent+".";
}

$("nextSet").addEventListener("click",()=>{
  if(answered<F.length) return;
  if(index<order.length-1){
    index++;
    renderSet();
    window.scrollTo({top:0,behavior:"smooth"});
  }else{
    $("bar").style.width="100%";
    $("questions").innerHTML="";
    $("aya").innerHTML="";
    $("ref").textContent="";
    $("sourceReview").className="sourceReview hide";
    $("summary").innerHTML="<b>انتهت اللعبة.</b><br>النتيجة: "+score+" / "+(data.length*F.length)+" — الأخطاء: "+wrong+".<br>اضغط «إعادة اللعبة من البداية» لبدء دورة جديدة.";
    $("summary").className="summary";
    $("nextSet").className="primary hide";
  }
});

$("restart").addEventListener("click",restartGame);
restartGame();
</script>
