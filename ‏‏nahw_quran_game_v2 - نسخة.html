<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لعبة النحو القرآني</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f5f1e8;margin:0;color:#222}
.w{max-width:980px;margin:auto;padding:22px}
.c{background:#fff;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 4px 18px #0001}
.aya{font-size:30px;line-height:2;text-align:center;margin:12px 0 18px}
.t{background:#ffe39a;padding:3px 8px;border-radius:8px}
.bar{height:13px;background:#e7dfd1;border-radius:9px;overflow:hidden;margin-top:10px}
.bar div{height:100%;background:#8d6b3e;transition:width .25s}
.muted{color:#777}
.pill{display:inline-block;background:#eee4d3;border-radius:999px;padding:5px 10px}
.qcard{border-top:1px solid #eee2d1;padding:17px 0}
.qcard:first-child{border-top:0}
.qtitle{font-size:19px;font-weight:700;margin-bottom:10px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px}
.choices button,.nav button{font:inherit;padding:12px;border:1px solid #c8b99e;background:#faf7f0;border-radius:11px;cursor:pointer;min-height:46px}
.choices button:disabled{cursor:default;color:#222}
.ok{background:#dff4df!important;border-color:#87b887!important}
.bad{background:#f6dada!important;border-color:#c68d8d!important}
.feedback{margin-top:8px;padding:9px 12px;background:#faf7f0;border-radius:9px}
.hide{display:none}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.nav button{font-weight:700}
.primary{background:#eee4d3!important}
.summary{font-size:18px;line-height:1.8}
@media(max-width:520px){.w{padding:12px}.c{padding:16px}.aya{font-size:25px}.choices{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="w">
<h1>لعبة النحو القرآني</h1>
<p>تظهر الأسئلة الخمسة معًا لكل مثال: <b>نوع الكلمة، الوظيفة النحوية، الحالة الإعرابية، العلامة، نوع الجملة.</b></p>

<div class="c">
<span>المثال: <b id="exampleNum"></b></span>　
<span>الصحيح: <b id="score">0</b></span>　
<span>الخطأ: <b id="wrong">0</b></span>
<div class="bar"><div id="bar"></div></div>
</div>

<div class="c" id="game">
<div id="ref" class="muted"></div>
<div id="aya" class="aya"></div>
<div id="questions"></div>
<div id="summary" class="summary hide"></div>
<div class="nav">
<button id="nextSet" class="primary hide" type="button">المجموعة التالية ←</button>
<button id="restart" type="button">إعادة اللعبة من البداية</button>
</div>
</div>

<div class="c"><b>المصدر الصحيح:</b> إعراب القرآن الكريم الميسر — أ. د. محمد الطيب الإبراهيم — دار النفائس.</div>
</div>

<script>
const data=[{"a": "الْحَمْدُ لِلّهِ رَبِّ الْعالَمِينَ", "r": "الفاتحة: 2", "w": "الْحَمْدُ", "kind": "اسم", "role": "مبتدأ", "state": "مرفوع", "mark": "الضمة", "sent": "جملة اسمية"}, {"a": "الْحَمْدُ لِلّهِ رَبِّ الْعالَمِينَ", "r": "الفاتحة: 2", "w": "الْعالَمِينَ", "kind": "اسم", "role": "مضاف إليه", "state": "مجرور", "mark": "الياء", "sent": "جملة اسمية"}, {"a": "إِيّاكَ نَعْبُدُ", "r": "الفاتحة: 5", "w": "إِيّاكَ", "kind": "ضمير", "role": "مفعول به مقدم", "state": "في محل نصب", "mark": "مبني", "sent": "جملة فعلية"}, {"a": "إِيّاكَ نَعْبُدُ", "r": "الفاتحة: 5", "w": "نَعْبُدُ", "kind": "فعل مضارع", "role": "فعل", "state": "مرفوع", "mark": "الضمة", "sent": "جملة فعلية"}, {"a": "اهْدِنَا الصِّراطَ الْمُسْتَقِيمَ", "r": "الفاتحة: 6", "w": "الصِّراطَ", "kind": "اسم", "role": "مفعول به ثان", "state": "منصوب", "mark": "الفتحة", "sent": "جملة فعلية"}, {"a": "اهْدِنَا الصِّراطَ الْمُسْتَقِيمَ", "r": "الفاتحة: 6", "w": "الْمُسْتَقِيمَ", "kind": "اسم", "role": "نعت", "state": "منصوب", "mark": "الفتحة", "sent": "جملة فعلية"}, {"a": "قالَ رَجُلانِ مِنَ الَّذِينَ يَخافُونَ", "r": "المائدة: 23", "w": "رَجُلانِ", "kind": "اسم", "role": "فاعل", "state": "مرفوع", "mark": "الألف", "sent": "جملة فعلية"}, {"a": "قَدْ أَفْلَحَ الْمُؤْمِنُونَ", "r": "المؤمنون: 1", "w": "الْمُؤْمِنُونَ", "kind": "اسم", "role": "فاعل", "state": "مرفوع", "mark": "الواو", "sent": "جملة فعلية"}, {"a": "لا تُفْسِدُوا فِي الْأَرْضِ", "r": "البقرة: 11", "w": "تُفْسِدُوا", "kind": "فعل مضارع", "role": "فعل", "state": "مجزوم", "mark": "حذف النون", "sent": "جملة فعلية"}, {"a": "وَبِالْآخِرَةِ هُمْ يُوقِنُونَ", "r": "البقرة: 4", "w": "يُوقِنُونَ", "kind": "فعل مضارع", "role": "خبر في جملة فعلية", "state": "مرفوع", "mark": "ثبوت النون", "sent": "جملة اسمية خبرها جملة فعلية"}, {"a": "فِي قُلُوبِهِمْ مَرَضٌ", "r": "البقرة: 10", "w": "مَرَضٌ", "kind": "اسم", "role": "مبتدأ مؤخر", "state": "مرفوع", "mark": "الضمة", "sent": "جملة اسمية"}, {"a": "فَزادَهُمُ اللهُ مَرَضاً", "r": "البقرة: 10", "w": "مَرَضاً", "kind": "اسم", "role": "مفعول به ثان", "state": "منصوب", "mark": "الفتحة", "sent": "جملة فعلية"}, {"a": "مِنَ الصَّواعِقِ حَذَرَ الْمَوْتِ", "r": "البقرة: 19", "w": "حَذَرَ", "kind": "اسم", "role": "مفعول لأجله", "state": "منصوب", "mark": "الفتحة", "sent": "جملة فعلية"}, {"a": "وَلا تَقْرَبا هذِهِ الشَّجَرَةَ", "r": "الأعراف: 19", "w": "تَقْرَبا", "kind": "فعل مضارع", "role": "فعل", "state": "مجزوم", "mark": "حذف النون", "sent": "جملة فعلية"}, {"a": "فَتَكُونا مِنَ الظّالِمِينَ", "r": "الأعراف: 19", "w": "تَكُونا", "kind": "فعل مضارع ناسخ", "role": "فعل ناسخ", "state": "منصوب", "mark": "حذف النون", "sent": "جملة فعلية"}, {"a": "أَلَمْ أَنْهَكُما عَنْ تِلْكُمَا الشَّجَرَةِ", "r": "الأعراف: 22", "w": "أَنْهَكُما", "kind": "فعل مضارع", "role": "فعل", "state": "مجزوم", "mark": "حذف حرف العلة", "sent": "جملة فعلية"}, {"a": "وَإِنْ لَمْ تَغْفِرْ لَنا", "r": "الأعراف: 23", "w": "تَغْفِرْ", "kind": "فعل مضارع", "role": "فعل الشرط", "state": "مجزوم", "mark": "السكون", "sent": "جملة شرطية"}, {"a": "يا بَنِي آدَمَ", "r": "الأعراف: 26", "w": "بَنِي", "kind": "اسم", "role": "منادى مضاف", "state": "منصوب", "mark": "الياء", "sent": "جملة نداء"}, {"a": "يُوارِي سَوْآتِكُمْ", "r": "الأعراف: 26", "w": "سَوْآتِكُمْ", "kind": "اسم", "role": "مفعول به", "state": "منصوب", "mark": "الكسرة", "sent": "جملة فعلية"}, {"a": "وَمَنْ يَهْدِ اللهُ فَهُوَ الْمُهْتَدِ", "r": "الإسراء: 97", "w": "يَهْدِ", "kind": "فعل مضارع", "role": "فعل الشرط", "state": "مجزوم", "mark": "حذف حرف العلة", "sent": "جملة شرطية"}, {"a": "لَنْ نُؤْمِنَ لَكَ", "r": "الإسراء: 90", "w": "نُؤْمِنَ", "kind": "فعل مضارع", "role": "فعل", "state": "منصوب", "mark": "الفتحة", "sent": "جملة فعلية"}, {"a": "إِنَّ اللهَ لا يَهْدِي", "r": "الزمر: 3", "w": "اللهَ", "kind": "اسم", "role": "اسم إن", "state": "منصوب", "mark": "الفتحة", "sent": "جملة اسمية ناسخة"}, {"a": "هُوَ اللهُ الْواحِدُ الْقَهّارُ", "r": "الزمر: 4", "w": "الْواحِدُ", "kind": "اسم", "role": "نعت", "state": "مرفوع", "mark": "الضمة", "sent": "جملة اسمية"}, {"a": "خَلَقَ السَّماواتِ وَالْأَرْضَ", "r": "الزمر: 5", "w": "السَّماواتِ", "kind": "اسم", "role": "مفعول به", "state": "منصوب", "mark": "الكسرة", "sent": "جملة فعلية"}, {"a": "إِنْ تَكْفُرُوا فَإِنَّ اللهَ غَنِيٌّ", "r": "الزمر: 7", "w": "تَكْفُرُوا", "kind": "فعل مضارع", "role": "فعل الشرط", "state": "مجزوم", "mark": "حذف النون", "sent": "جملة شرطية"}, {"a": "إِنَّما يَتَذَكَّرُ أُولُوا الْأَلْبابِ", "r": "الزمر: 9", "w": "أُولُوا", "kind": "اسم", "role": "فاعل", "state": "مرفوع", "mark": "الواو", "sent": "جملة فعلية"}, {"a": "قُرْآناً عَرَبِيًّا غَيْرَ ذِي عِوَجٍ", "r": "الزمر: 28", "w": "ذِي", "kind": "اسم", "role": "مضاف إليه", "state": "مجرور", "mark": "الياء", "sent": "تركيب وصفي"}];
const F=[
 ["kind","١. ما نوع الكلمة؟"],
 ["role","٢. ما الوظيفة النحوية؟"],
 ["state","٣. ما الحالة الإعرابية؟"],
 ["mark","٤. ما علامة الإعراب؟"],
 ["sent","٥. ما نوع الجملة أو التركيب؟"]
];

let order=[], index=0, score=0, wrong=0, answered=0;

const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}

function restartGame(){
  order=shuffle(data);
  index=0; score=0; wrong=0; answered=0;
  $("score").textContent="0";
  $("wrong").textContent="0";
  $("bar").style.width="0%";
  $("summary").className="summary hide";
  renderSet();
}

function makeOptions(field, correct){
  const others=[...new Set(data.map(z=>z[field]))].filter(v=>v!==correct);
  return shuffle([correct,...shuffle(others).slice(0,3)]);
}

function renderSet(){
  answered=0;
  $("nextSet").className="primary hide";
  $("summary").className="summary hide";
  const x=order[index];
  $("exampleNum").textContent=(index+1)+" / "+order.length;
  $("ref").textContent=x.r;
  $("aya").innerHTML=x.a.replace(x.w,'<span class="t">'+x.w+'</span>');
  const box=$("questions");
  box.innerHTML="";

  F.forEach(([field,label],qIndex)=>{
    const section=document.createElement("section");
    section.className="qcard";
    const title=document.createElement("div");
    title.className="qtitle";
    title.textContent=label;
    const choices=document.createElement("div");
    choices.className="choices";
    const feedback=document.createElement("div");
    feedback.className="feedback hide";

    makeOptions(field,x[field]).forEach(v=>{
      const b=document.createElement("button");
      b.type="button";
      b.textContent=v;
      b.addEventListener("click",()=>answerQuestion(choices,feedback,b,v,x[field],x));
      choices.appendChild(b);
    });

    section.append(title,choices,feedback);
    box.appendChild(section);
  });
}

function answerQuestion(choices,feedback,button,value,correct,x){
  if(choices.dataset.done==="1") return;
  choices.dataset.done="1";
  answered++;

  [...choices.children].forEach(b=>{
    b.disabled=true;
    if(b.textContent===correct) b.classList.add("ok");
  });

  if(value===correct){
    score++;
    feedback.innerHTML="<b>صحيح ✓</b>";
  }else{
    wrong++;
    button.classList.add("bad");
    feedback.innerHTML="<b>الصواب: "+correct+"</b>";
  }
  feedback.className="feedback";
  $("score").textContent=score;
  $("wrong").textContent=wrong;

  const total=data.length*F.length;
  const completed=index*F.length+answered;
  $("bar").style.width=(completed/total*100)+"%";

  if(answered===F.length){
    $("summary").innerHTML="<b>التحليل الكامل:</b> "+explain(x);
    $("summary").className="summary";
    if(index < order.length-1){
      $("nextSet").textContent="المجموعة التالية ←";
      $("nextSet").className="primary";
    }else{
      $("nextSet").textContent="إنهاء وعرض النتيجة";
      $("nextSet").className="primary";
    }
  }
}

function explain(x){
  return "<b>"+x.w+"</b> — "+x.role+"؛ "+x.state+"، وعلامته: "+x.mark+"؛ "+x.sent+".";
}

$("nextSet").addEventListener("click",()=>{
  if(answered<F.length) return;
  if(index<order.length-1){
    index++;
    renderSet();
    window.scrollTo({top:0,behavior:"smooth"});
  }else{
    $("bar").style.width="100%";
    $("questions").innerHTML="";
    $("aya").innerHTML="";
    $("ref").textContent="";
    $("summary").innerHTML="<b>انتهت اللعبة.</b><br>النتيجة: "+score+" / "+(data.length*F.length)+" — الأخطاء: "+wrong+".<br>اضغط «إعادة اللعبة من البداية» لبدء دورة جديدة.";
    $("summary").className="summary";
    $("nextSet").className="primary hide";
  }
});

$("restart").addEventListener("click",restartGame);
restartGame();
</script>
</body>
</html>
