<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مفردات القرآن — Engine</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071a18;color:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif;min-height:100vh}#phaser{position:fixed;inset:0;z-index:0;opacity:.3}.ui{position:relative;z-index:2;max-width:930px;margin:auto;padding:18px}.card{background:#102c27ee;border:1px solid #ffffff24;border-radius:18px;padding:19px;margin:13px 0}.top,.controls,.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.top a{color:#f0d57d}.controls label{display:grid;gap:5px}select,input,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #c9bea2}button{cursor:pointer}.primary{background:#d5b86a;color:#10221e;font-weight:700}.word{text-align:center;font-size:2.25rem;color:#f0d57d;margin:10px}.meta{color:#c9ded8;line-height:1.7}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.choices button{text-align:right;background:#fff;color:#111;padding:13px}.choices .ok{background:#ccebcf}.choices .bad{background:#f1c9c9}.verse{line-height:2;font-size:1.1rem;background:#ffffff0d;padding:12px;border-radius:10px;margin-top:12px}.bar{height:14px;background:#ffffff18;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#d5b86a;width:0}.feedback{text-align:center;font-weight:700;min-height:30px}.next{width:100%;margin-top:12px}.badge{display:inline-block;background:#d5b86a;color:#10221e;padding:5px 9px;border-radius:99px;font-size:.82rem}@media(max-width:620px){.choices{grid-template-columns:1fr}.ui{padding:10px}}</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script></head><body><div id="phaser"></div><div class="ui">
<div class="top"><div><h1>مفردات القرآن — اختيار من متعدد</h1><span class="badge">Phaser Engine v1</span></div><a href="../index.html">العودة إلى المنصة</a></div>
<div class="card controls"><label>السورة<select id="surah"></select></label><label>النمط<select id="mode"><option value="chapter">اختبار السورة</option><option value="all">مراجعة شاملة</option><option value="wrong">الأخطاء فقط</option></select></label><label>الجولة<input id="round" type="number" min="1" value="1" style="width:100px"></label><button id="start" class="primary">ابدأ / اذهب إلى الجولة</button></div>
<div class="card"><div class="row"><b>تقدم الاختبار الحالي</b><span id="localText">0%</span></div><div class="bar"><i id="localBar"></i></div><div class="row" style="margin-top:12px"><b>التقدم الكامل في قاعدة المفردات</b><span id="globalText">0%</span></div><div class="bar"><i id="globalBar"></i></div></div>
<div class="card"><div id="position" class="meta">اختر سورة ثم ابدأ</div><div id="word" class="word">—</div><div id="level" class="meta" style="text-align:center"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div><div id="verse"></div><button id="next" class="primary next" hidden>التالي ←</button></div>
</div><script type="module" src="vocab.js"></script></body></html>
