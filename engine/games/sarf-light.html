<style>*{box-sizing:border-box}body{margin:0;background:#071a18;color:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif;min-height:100vh}#phaser{position:fixed;inset:0;z-index:0;opacity:.35}.ui{position:relative;z-index:2;max-width:920px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.top a{color:#f0d57d}.card{background:#102c27ee;border:1px solid #ffffff24;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 30px #0004}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.controls label{display:grid;gap:5px}.controls select{font:inherit;padding:10px;border-radius:9px}.verb{text-align:center;font-size:2rem;color:#f0d57d;margin:12px}.q{font-size:1.35rem;text-align:center;line-height:1.8}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.choices button,.next{font:inherit;padding:13px;border-radius:11px;border:1px solid #d4c39a;background:#f7f2e6;color:#17241f;cursor:pointer}.choices button.ok{background:#ccebcf}.choices button.bad{background:#f1c9c9}.choices button:disabled{cursor:default}.next{background:#d5b86a;font-weight:700;width:100%;margin-top:14px}.next[hidden]{display:none}.bars{display:grid;gap:10px}.bar{height:14px;background:#ffffff18;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#d5b86a;width:0}.status{color:#c9ded8;line-height:1.7}.feedback{min-height:32px;text-align:center;font-weight:700;margin-top:10px}.ref{text-align:center;color:#b9d3cc}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#ffffff16}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}@media(max-width:620px){.choices{grid-template-columns:1fr}.ui{padding:10px}.verb{font-size:1.6rem}}</style>

</div><script type="module" src="sarf-light.js"></script></body></html>
