<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مطابقة مفردات القرآن — Engine</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071a18;color:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif;min-height:100vh}#phaser{position:fixed;inset:0;z-index:0;opacity:.28}.ui{position:relative;z-index:2;max-width:1000px;margin:auto;padding:16px}.card{background:#102c27ee;border:1px solid #ffffff24;border-radius:18px;padding:18px;margin:12px 0}.top,.controls,.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.top a{color:#f0d57d}.controls label{display:grid;gap:5px}select,input,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #c9bea2}button{cursor:pointer}.primary{background:#d5b86a;color:#10221e;font-weight:700}.board{display:grid;grid-template-columns:1fr 1fr;gap:18px}.col{display:grid;gap:9px;align-content:start}.item{background:#fff;color:#111;min-height:52px;text-align:right}.item.sel{outline:3px solid #d5b86a}.item.matched{background:#ccebcf;opacity:.72}.item.bad{background:#f1c9c9}.bar{height:14px;background:#ffffff18;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#d5b86a;width:0}.meta{color:#c9ded8;line-height:1.7}.msg{text-align:center;min-height:30px;font-weight:700}.segments{display:flex;direction:rtl;height:34px;gap:1px;margin-top:8px}.seg{flex:1;min-width:2px;border-radius:2px;background:linear-gradient(to top,#d5b86a var(--p),#ffffff18 var(--p))}.badge{display:inline-block;background:#d5b86a;color:#10221e;padding:5px 9px;border-radius:99px;font-size:.82rem}@media(max-width:650px){.board{grid-template-columns:1fr}.ui{padding:9px}}</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script></head><body><div id="phaser"></div><div class="ui">
<div class="top"><div><h1 id="title">مطابقة مفردات القرآن</h1><span class="badge">Phaser Engine v1</span></div><a href="../index.html">العودة إلى المنصة</a></div>
<div class="card controls"><label>السورة<select id="surah"></select></label><label>عدد الكلمات<select id="count"></select></label><label>النمط<select id="mode"><option value="chapter">اختبار السورة</option><option value="all">مراجعة شاملة</option><option value="wrong">الأخطاء فقط</option></select></label><label>الجولة<input id="round" type="number" min="1" value="1" style="width:100px"></label><button id="start" class="primary">ابدأ / اذهب إلى الجولة</button></div>
<div class="card"><div class="row"><b>تقدم الجولة</b><span id="localText">0%</span></div><div class="bar"><i id="localBar"></i></div><div class="row" style="margin-top:12px"><b>التقدم الكامل</b><span id="globalText">0%</span></div><div class="bar"><i id="globalBar"></i></div><div id="surahProgress" class="segments"></div></div>
<div class="card"><div id="position" class="meta"></div><div id="msg" class="msg">اختر السورة ثم ابدأ.</div><div class="board"><div><h3>الكلمات</h3><div id="words" class="col"></div></div><div><h3>المعاني</h3><div id="defs" class="col"></div></div></div><button id="next" class="primary" style="width:100%;margin-top:14px" hidden>الجولة التالية ←</button></div>
</div><script type="module" src="matching.js"></script></body></html>
