<style>*{box-sizing:border-box}body{margin:0;background:#071a18;color:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif}#phaser{position:fixed;inset:0;z-index:0;opacity:.27}.ui{position:relative;z-index:2;max-width:930px;margin:auto;padding:16px}.card{background:#102c27ee;border:1px solid #ffffff24;border-radius:18px;padding:19px;margin:13px 0}.top,.controls,.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.top a{color:#f0d57d}.controls label{display:grid;gap:5px}select,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #c9bea2}select{max-width:520px}.primary{background:#d5b86a;color:#10221e;font-weight:700}.verb{text-align:center;font-size:2rem;color:#f0d57d}.q{text-align:center;font-size:1.3rem;line-height:1.8}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choices button{background:#fff;color:#111;padding:12px}.choices .ok{background:#ccebcf}.choices .bad{background:#f1c9c9}.bar{height:14px;background:#ffffff18;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#d5b86a;width:0}.meta{color:#c9ded8}.feedback{text-align:center;min-height:32px;font-weight:700}.next{width:100%;margin-top:12px}.badge{display:inline-block;background:#d5b86a;color:#10221e;padding:5px 9px;border-radius:99px;font-size:.82rem}@media(max-width:620px){.choices{grid-template-columns:1fr}.ui{padding:9px}}</style><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script></head><body><div id="phaser"></div><div class="ui">
