<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استخرج مفردات القرآن — Engine</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071a18;color:#fff;font-family:Tahoma,"Segoe UI",Arial,sans-serif}#phaser{position:fixed;inset:0;z-index:0;opacity:.28}.ui{position:relative;z-index:2;max-width:900px;margin:auto;padding:18px}.card{background:#102c27ee;border:1px solid #ffffff24;border-radius:18px;padding:20px;margin:13px 0}.top,.controls,.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.top a{color:#f0d57d}.controls label{display:grid;gap:5px}select,input,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #c9bea2}button{cursor:pointer}.primary{background:#d5b86a;color:#10221e;font-weight:700}.ayah{font-size:1.4rem;line-height:2.1;text-align:center;background:#ffffff0b;border-radius:12px;padding:15px}.definition{text-align:center;font-size:1.25rem;color:#f0d57d;line-height:1.8}.answer{display:flex;gap:9px;margin-top:15px}.answer input{flex:1;font-size:1.15rem}.bar{height:14px;background:#ffffff18;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#d5b86a;width:0}.meta{color:#c9ded8;line-height:1.7}.feedback{text-align:center;font-weight:700;min-height:34px;margin-top:10px}.badge{display:inline-block;background:#d5b86a;color:#10221e;padding:5px 9px;border-radius:99px;font-size:.82rem}@media(max-width:620px){.answer{flex-direction:column}.ui{padding:10px}}</style><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script></head><body><div id="phaser"></div><div class="ui">
<div class="top"><div><h1>استخرج مفردات القرآن</h1><span class="badge">Phaser Engine v1</span></div><a href="../index.html">العودة إلى المنصة</a></div>
<div class="card controls"><label>السورة<select id="surah"></select></label><label>النمط<select id="mode"><option value="chapter">اختبار السورة</option><option value="all">مراجعة شاملة</option><option value="wrong">الضعيف فقط</option></select></label><label>الجولة<input id="round" type="number" min="1" value="1" style="width:100px"></label><button id="start" class="primary">ابدأ / اذهب إلى الجولة</button></div>
<div class="card"><div class="row"><b>تقدم الاختبار</b><span id="localText">0%</span></div><div class="bar"><i id="localBar"></i></div><div class="row" style="margin-top:12px"><b>التقدم الكامل</b><span id="globalText">0%</span></div><div class="bar"><i id="globalBar"></i></div></div>
<div class="card"><div id="position" class="meta"></div><div id="ayah" class="ayah">—</div><div id="definition" class="definition"></div><div class="answer"><input id="answer" autocomplete="off" placeholder="اكتب الكلمة القرآنية"><button id="check" class="primary">تحقق</button><button id="hint">تلميح</button></div><div id="feedback" class="feedback"></div><button id="next" class="primary" style="width:100%" hidden>التالي ←</button></div>
</div><script type="module" src="istakhraj.js"></script></body></html>
